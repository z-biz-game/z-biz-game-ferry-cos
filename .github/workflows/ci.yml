name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The rule, the solver, the generator and the shipped pool are all pure ES modules: no
  # browser and no install step. Two rows are the reason this job exists:
  #   * anchors.test.mjs — the eight rows of the classic crossing table (wolf-goat-cabbage 7,
  #     M&C 1+1/2+2/3+3 free = 1/5/11, 4+4/5+5 free unsolvable, 1+1/2+2 ferry = 3/7, 3+3/4+4
  #     ferry unsolvable) are reproduced from hand-written expectations by js/core/solve.js AND
  #     by a second, independent layer-by-layer search in the same file; every "unsolvable"
  #     verdict is only accepted when the frontier ran out (`truncated === false`), so no
  #     clause of the code is allowed to grade its own answer;
  #   * library.test.mjs — re-solves every level in js/data/lots.js from its serialised spec,
  #     so a hand-edited par or a stale bake fails the build instead of shipping.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: for f in js/*.js js/*/*.js server.cjs electron/main.cjs tools/*.mjs test/*.mjs; do node --check "$f"; done
      - name: Suites
        run: for f in test/*.test.mjs; do echo "::group::$f"; node "$f"; echo "::endgroup::"; done
      # The sixth gate, byte for byte the command a contributor runs locally (`npm run doctest`,
      # and the same call inside `tools/verify.sh`): every number printed into README / DESIGN /
      # deliverable is compared against what the code reports right now, and each parse carries an
      # anti-no-op row-count assertion so "the regex matched nothing" can never read as green.
      - name: Doc numbers
        run: node tools/doctest.mjs

      # The ledger above is what makes that green mean something: eight documented lies written back
      # into throwaway copies, each required to turn the gate red AND name its own assertion, plus a
      # knife-free control. It starts no browser, so it belongs in this job — and D4n in doctest.mjs
      # fails if any of verify.sh / this step / package.json / README stops calling it.
      - name: Sabotage ledger trips the doc gate
        run: node tools/sabotage.mjs
      # 部署集闸：按 tools/assemble-site.sh 那份清单真拷一遍产物，要求页面会去要的东西
      # 都在里面。这一仓曾经因为清单落后于页面而线上 404 自己的 manifest/sw.js/图标，
      # 而本地一切全绿——因为本地根本没有「按清单拷」这一步。
      - name: Deploy set gate
        run: node tools/deploy-set.mjs
      # 阴性自证：每一类断言当场被打红一次，闸必须点名吃掉那一刀；写在注释里的假路径
      # 必须不算引用。钉住的条数由这一跑证明它真的会红，不是由记性证明。
      - name: Deploy set gate proves it can fail
        run: node tools/deploy-set-selftest.mjs

  # The shell is only proven by driving a real page with real mouse events: the canvas hit
  # test, the illegal-loading rule and the save file all live behind `window.ferry`.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headless playtest
        env:
          SKIP_UNIT: 1
          WD_TIMEOUT: 240
        run: bash tools/verify.sh
